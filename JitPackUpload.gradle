import org.gradle.api.publish.maven.MavenPublication
import org.gradle.api.publish.maven.tasks.PublishToMavenRepository

// 指定group，com.github.<用户名>，这里我默认填写的是我的github账号，请换成你自己的。
group = 'com.github.xuexiangjys'

//---------------------------------------------

// 指定编码
tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}

if (project.hasProperty("android")) { // Android libraries
    task sourcesJar(type: Jar) {
        archiveClassifier = 'sources'
        from android.sourceSets.main.java.srcDirs
    }

    task javadoc(type: Javadoc) {
        failOnError = false
        source = android.sourceSets.main.java.srcDirs
        classpath += project.files(android.getBootClasspath().join(File.pathSeparator))
    }
} else { // Java libraries
    task sourcesJar(type: Jar, dependsOn: classes) {
        archiveClassifier = 'sources'
        from sourceSets.main.allSource
    }
}

javadoc {
    options {
        encoding "UTF-8"
        charSet 'UTF-8'
        author true
        version true
        links "http://docs.oracle.com/javase/7/docs/api"
    }
}

// 制作文档(Javadoc)
task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

// 使用 Gradle 内置的 maven-publish 插件替代已废弃的 android-maven 插件
apply plugin: 'maven-publish'

// 在 projectsEvaluated 阶段配置发布，确保 AGP 的 component 已经注册
project.gradle.projectsEvaluated {
    // 查找第一个非 java 的 component（Android library 通常是 release/library）
    def publishComponent = null
    for (def name : project.components.names) {
        if (!name.equals("java")) {
            publishComponent = project.components.getByName(name)
            break
        }
    }

    if (publishComponent != null) {
        publishing {
            publications {
                release(MavenPublication) {
                    from publishComponent
                    groupId = group
                    artifactId = project.name
                    artifact sourcesJar
                    artifact javadocJar
                }
            }
        }
    }
}
